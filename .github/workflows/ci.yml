name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  model:
    name: Model (provenance proof, synthetic-voice reproduction)
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - name: Install CPU inference dependencies
        run: pip install -r requirements-inference.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Cache pinned HuBERT checkpoint
        uses: actions/cache@v4
        with:
          path: hf-cache
          key: hubert-large-ls960-ft-ece5fabb
      - name: Backend unit tests
        run: python -m unittest discover -s tests/python -v
      - name: Prove deployed weights come from the recorded training run (11 checks)
        run: python scripts/build_model_card.py --check
      - name: Reproduce inference on synthetic examples
        run: python scripts/reproduce_inference.py
